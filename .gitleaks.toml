# gitleaks: allowlist для синтетических фикстур и примеров.
[extend]
useDefault = true

[allowlist]
description = "TEST-NET fixtures, synthetic keys, offline harness examples"
paths = [
  '''testdata/''',
  '''examples/registry/''',
  '''\.private-blocklist\.txt''',
]
regexes = [
  '''TEST[A-Z]{3,}''',
  '''11111111-1111-4111-8111-111111111111''',
  '''synthetic-''',
  '''TESTPUBKZ''',
]
